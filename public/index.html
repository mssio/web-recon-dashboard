<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Web Recon Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
  </div>

  <main>
    <header class="hero">
      <div class="radar-rings" aria-hidden="true"><span></span><span></span><span></span></div>
      <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Web Recon Dashboard logo">
        <defs>
          <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#38bdf8" />
            <stop offset="1" stop-color="#6366f1" />
          </linearGradient>
        </defs>
        <path d="M32 4 L56 13 V32 C56 46 46 56 32 60 C18 56 8 46 8 32 V13 Z" fill="#0b1220" stroke="url(#logo-grad)" stroke-width="3" stroke-linejoin="round" />
        <circle cx="32" cy="32" r="16" fill="none" stroke="#38bdf8" stroke-opacity=".4" />
        <circle cx="32" cy="32" r="8" fill="none" stroke="#38bdf8" stroke-opacity=".4" />
        <g class="logo-sweep"><path d="M32 32 L32 16 A16 16 0 0 1 45.9 24 Z" fill="#38bdf8" fill-opacity=".5" /></g>
        <circle class="logo-blip" cx="40" cy="27" r="2.2" fill="#22c55e" />
      </svg>
      <h1>Web Recon <span class="grad">Dashboard</span></h1>
      <p class="subtitle">Point it at a domain. Get a security health report in seconds.</p>
    </header>

    <form id="scan-form" class="scan-form">
      <input type="text" id="domain-input" placeholder="example.com" autocomplete="off" spellcheck="false" required />
      <button type="submit" id="scan-btn"><span class="btn-spinner" aria-hidden="true"></span><span id="scan-btn-label">Scan</span></button>
    </form>
    <label class="consent">
      <input type="checkbox" id="authorized-input" />
      <span>I own this domain or have permission to test it (enables the active port probe)</span>
    </label>
    <p class="hint">Only scan domains you own or have explicit permission to test.</p>

    <div id="error-banner" class="error-banner hidden" role="alert"></div>

    <div id="scan-status" class="scan-status hidden" role="status" aria-live="polite">
      <div class="scan-radar" aria-hidden="true"><span class="scan-sweep"></span></div>
      <p id="scan-status-text">Starting scan…</p>
      <div class="scan-bar" aria-hidden="true"><span></span></div>
    </div>

    <div id="score-display" class="score-panel hidden"></div>
    <div id="chart-container" class="chart-container hidden">
      <div class="chart-box"><canvas id="score-chart"></canvas></div>
    </div>
    <div id="results"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
